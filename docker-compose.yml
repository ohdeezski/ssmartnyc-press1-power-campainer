version: '3.8'

# Secrets moved to environment interpolation (2026-08-02).
# Supply real values via a .env file or the deployment secret manager:
#   POSTGRES_PASSWORD, POSTGRES_USER, POSTGRES_DB, SECRET_KEY, DATABASE_URL
# Never commit real credentials. See .env.example.

services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-street_smart}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-street_smart}}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      - db
      - redis
    volumes:
      - uploads:/app/uploads
      - config:/app/config
      - logs:/app/logs
      - exports:/app/exports
    restart: unless-stopped

  celery:
    build: .
    command: celery -A app.modules.taskqueue.celery_app worker --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-street_smart}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-street_smart}}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A app.modules.taskqueue.celery_app beat --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-street_smart}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-street_smart}}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-street_smart}
      POSTGRES_USER: ${POSTGRES_USER:-street_smart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
  config:
  logs:
  exports:
