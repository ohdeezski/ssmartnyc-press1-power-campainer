{% extends "ui/base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-6">
  <h2 class="font-headline-md text-headline-md font-bold text-primary tracking-widest uppercase">Edit — {{ campaign.name }}</h2>
  <a href="{{ url_for('campaigns.campaign_detail', campaign_id=campaign.id) }}"
     class="text-label-md text-label-md text-outline hover:text-primary transition-colors uppercase tracking-wider">View Detail</a>
</div>

<form method="POST" class="bg-surface border border-primary/40 rounded-xl p-6 max-w-2xl">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-4">
    <label class="block text-label-md text-label-md text-outline mb-1 uppercase tracking-wider">Campaign Name</label>
    <input type="text" name="name" required value="{{ campaign.name }}" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface focus:border-primary focus:outline-none">
  </div>
  <div class="mb-4">
    <label class="block text-label-md text-label-md text-outline mb-1 uppercase tracking-wider">Channel</label>
    <select name="type" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface focus:border-primary focus:outline-none">
      {% for value, label in [
          ('voice', 'Voice (Press-1)'), ('sms', 'SMS'), ('email', 'Email'),
          ('whatsapp', 'WhatsApp'), ('telegram', 'Telegram'), ('multi', 'Multi-channel')] %}
      <option value="{{ value }}" {% if campaign.type == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-6 p-4 rounded-xl border border-outline-variant/40 bg-surface-container-lowest/40">
    <label class="block text-label-md text-label-md text-outline mb-1 uppercase tracking-wider">Sender Identity</label>
    <p class="text-sm text-outline mb-3">The caller ID / sender the recipient sees. Leave blank to use provider defaults.</p>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-label-md text-label-md text-outline mb-1">Caller ID Name</label>
        <input type="text" name="caller_id_name" value="{{ (campaign.settings or {}).get('sender', {}).get('caller_id_name') or '' }}" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface focus:border-primary focus:outline-none">
      </div>
      <div>
        <label class="block text-label-md text-label-md text-outline mb-1">Caller ID Number</label>
        <input type="text" name="caller_id_number" value="{{ (campaign.settings or {}).get('sender', {}).get('caller_id_number') or '' }}" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface focus:border-primary focus:outline-none">
      </div>
      <div>
        <label class="block text-label-md text-label-md text-outline mb-1">SMS Sender ID</label>
        <input type="text" name="sms_sender_id" value="{{ (campaign.settings or {}).get('sender', {}).get('sms_sender_id') or '' }}" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface focus:border-primary focus:outline-none">
      </div>
      <div>
        <label class="block text-label-md text-label-md text-outline mb-1">SMS From Number</label>
        <input type="text" name="sms_from_number" value="{{ (campaign.settings or {}).get('sender', {}).get('sms_from_number') or '' }}" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface focus:border-primary focus:outline-none">
      </div>
      <div>
        <label class="block text-label-md text-label-md text-outline mb-1">Email From Name</label>
        <input type="text" name="email_from_name" value="{{ (campaign.settings or {}).get('sender', {}).get('email_from_name') or '' }}" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface focus:border-primary focus:outline-none">
      </div>
      <div>
        <label class="block text-label-md text-label-md text-outline mb-1">Email From Address</label>
        <input type="text" name="email_from_address" value="{{ (campaign.settings or {}).get('sender', {}).get('email_from_address') or '' }}" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface focus:border-primary focus:outline-none">
      </div>
      <div>
        <label class="block text-label-md text-label-md text-outline mb-1">WhatsApp Sender Name</label>
        <input type="text" name="whatsapp_sender_name" value="{{ (campaign.settings or {}).get('sender', {}).get('whatsapp_sender_name') or '' }}" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface focus:border-primary focus:outline-none">
      </div>
      <div>
        <label class="block text-label-md text-label-md text-outline mb-1">Telegram Sender Name</label>
        <input type="text" name="telegram_sender_name" value="{{ (campaign.settings or {}).get('sender', {}).get('telegram_sender_name') or '' }}" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface focus:border-primary focus:outline-none">
      </div>
    </div>
  </div>

  <div class="mb-6">
    <label class="block text-label-md text-label-md text-outline mb-1 uppercase tracking-wider">Settings (JSON)</label>
    <textarea name="settings" rows="8" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-on-surface font-mono text-label-sm focus:border-primary focus:outline-none">{{ campaign.settings | tojson if campaign.settings else '{}' }}</textarea>
  </div>
  <div class="flex gap-3">
    <button type="submit" class="font-label-md text-label-md uppercase tracking-wider text-background bg-primary px-4 py-2 rounded hover:bg-primary-fixed-dim transition-colors">Save Changes</button>
    <a href="{{ url_for('campaigns.campaign_list') }}"
       class="px-4 py-2 text-outline hover:text-primary transition-colors">Back to list</a>
  </div>
</form>
{% endblock %}
