{% extends "ui/base.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center text-center py-24">
    <span class="material-symbols-outlined text-error/40 text-7xl mb-4">error</span>
    <h1 class="font-headline-lg text-headline-lg text-error tracking-widest uppercase">500 — System Fault</h1>
    <p class="text-outline mt-3">A core module threw an exception. The operator has been notified.</p>
    <a href="{{ url_for('ui.dashboard') }}" class="mt-6 bg-primary text-background px-4 py-2 rounded font-label-md uppercase tracking-wider hover:bg-primary-fixed-dim">Return to Command</a>
</div>
{% endblock %}
