{# verify_row.html — launch-readiness check row. Params: label, state
   (ok/warn/missing), detail (optional). #}
<div class="flex items-center gap-3 py-2">
  {% if state == 'ok' %}
  <span class="material-symbols-outlined text-[18px] text-status-green">verified</span>
  {% elif state == 'warn' %}
  <span class="material-symbols-outlined text-[18px] text-status-yellow">warning</span>
  {% else %}
  <span class="material-symbols-outlined text-[18px] text-status-red">cancel</span>
  {% endif %}
  <span class="flex-1 text-body-md text-body-md text-on-surface">{{ label }}</span>
  {% if detail is defined and detail %}<span class="font-mono text-label-sm text-label-sm text-outline">{{ detail }}</span>{% endif %}
</div>
