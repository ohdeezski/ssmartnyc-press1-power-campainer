{# setup_card.html — configuration target card (providers, integrations).
   Params: title, icon, description, action_url (optional), action_text. #}
<div class="bg-surface border border-primary/40 rounded-xl p-6">
  <div class="flex items-center gap-3 mb-3">
    <span class="w-9 h-9 rounded-lg bg-primary/10 border border-primary/30 flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined text-[20px] text-primary">{{ icon|default('settings') }}</span>
    </span>
    <h3 class="font-headline-sm text-headline-sm font-bold text-primary uppercase tracking-widest">{{ title }}</h3>
  </div>
  <p class="text-body-md text-body-md text-outline mb-4">{{ description }}</p>
  {% if action_url %}
  <a href="{{ action_url }}" class="inline-flex items-center gap-1 font-label-md text-label-md uppercase tracking-wider text-primary border border-primary/50 px-3 py-1.5 rounded hover:bg-primary/10 transition-colors">
    {{ action_text|default('CONFIGURE') }}
  </a>
  {% endif %}
</div>
