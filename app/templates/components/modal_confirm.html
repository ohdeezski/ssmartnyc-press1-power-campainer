{# modal_confirm.html — destructive-action confirm dialog. Params: id, title,
   body, action_url, action_text. Toggle with [data-modal-open] / close with
   [data-modal-close] (app.js initModals). #}
<div id="{{ id }}" class="hidden fixed inset-0 z-[1100] items-center justify-center bg-black/70" role="dialog" aria-modal="true" aria-label="{{ title }}">
  <div class="bg-surface border border-primary/40 rounded-xl p-6 w-full max-w-md mx-4">
    <h3 class="font-headline-sm text-headline-sm font-bold text-primary uppercase tracking-widest mb-2">{{ title }}</h3>
    <p class="text-body-md text-body-md text-outline mb-6">{{ body }}</p>
    <div class="flex justify-end gap-3">
      <button type="button" class="font-label-md text-label-md uppercase tracking-wider text-outline px-4 py-2 border border-outline-variant rounded hover:text-on-surface transition-colors" data-modal-close="{{ id }}">Cancel</button>
      <form method="POST" action="{{ action_url }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="font-label-md text-label-md uppercase tracking-wider text-background bg-status-red px-4 py-2 rounded hover:opacity-90 transition-opacity">{{ action_text|default('Confirm') }}</button>
      </form>
    </div>
  </div>
</div>
